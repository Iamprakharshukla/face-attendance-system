<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BiometricAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030014;
            --text-color: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%);
            --btn-hover-gradient: linear-gradient(135deg, #94a3b8 0%, #475569 100%);
            --primary-shadow: 0 4px 0 0 #312e81, 0 8px 16px -4px rgba(99, 102, 241, 0.4);
            --primary-shadow-hover: 0 6px 0 0 #312e81, 0 12px 20px -2px rgba(99, 102, 241, 0.45);
            --primary-shadow-active: 0 1px 0 0 #312e81, 0 2px 4px -1px rgba(99, 102, 241, 0.2);
            --input-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Nebula Glow elements */
        .nebula-glow-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .nebula-glow-2 {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .nebula-glow-3 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        /* 3D Glassmorphic Card */
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .auth-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 60%);
            pointer-events: none;
        }

        .auth-card:hover {
            transform: translateY(-6px) scale(1.005);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        /* 3D Icon Container */
        .brand-icon-3d {
            width: 56px;
            height: 56px;
            border-radius: 20px;
            background: var(--primary-gradient);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 16px -4px rgba(79, 70, 229, 0.45),
                inset 0 4px 6px rgba(255, 255, 255, 0.35),
                inset 0 -4px 6px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #ffffff;
            font-size: 1.5rem;
            position: relative;
            transition: transform 0.3s ease;
        }

        .brand-icon-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0));
            border-radius: 20px 20px 0 0;
            pointer-events: none;
        }

        .auth-card:hover .brand-icon-3d {
            transform: translateY(-4px) rotate(4deg) scale(1.05);
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .auth-header p {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 3D Form Input Fields */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .form-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 16px 14px 44px;
            font-family: inherit;
            color: #f8fafc;
            font-size: 0.875rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--input-shadow);
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .form-group input:focus {
            border-color: #818cf8;
            box-shadow: 
                inset 0 1px 2px 0 rgba(0, 0, 0, 0.05),
                0 0 0 4px rgba(117, 127, 255, 0.15);
        }

        .form-group input:focus + i {
            color: #818cf8;
        }

        /* 3D primary tactile button */
        .btn-3d-primary {
            width: 100%;
            background: var(--primary-gradient);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            padding: 14px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: var(--primary-shadow);
            margin-top: 10px;
        }

        .btn-3d-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--primary-shadow-hover);
        }

        .btn-3d-primary:active {
            transform: translateY(3px);
            box-shadow: var(--primary-shadow-active);
        }

        /* Footer styling */
        .auth-footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 24px;
            margin-top: 24px;
        }

        .auth-footer p {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .auth-footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #a7f3d0;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-info {
            background-color: rgba(59, 130, 246, 0.1);
            color: #bfdbfe;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="nebula-glow-1"></div>
    <div class="nebula-glow-2"></div>
    <div class="nebula-glow-3"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon-3d">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Register a new administrator account</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                            <i class="fas {{ 'fa-circle-xmark' if category == 'error' else 'fa-circle-check' if category == 'success' else 'fa-circle-info' }}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required
                               placeholder="Choose a username">
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" required
                               placeholder="Enter your email">
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="full_name" name="full_name"
                               placeholder="Enter your full name (optional)">
                        <i class="fas fa-id-card"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required
                               placeholder="Create password (min 6 characters)" minlength="6">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" required
                               placeholder="Confirm your password" minlength="6">
                        <i class="fas fa-shield"></i>
                    </div>
                </div>

                <button type="submit" class="btn-3d-primary">
                    <i class="fas fa-user-check"></i>
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? 
                    <a href="{{ url_for('auth.login') }}">Sign in here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Password confirmation validation
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
